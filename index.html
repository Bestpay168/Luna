<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Luna Core Mobile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050509;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #090912;
    }

    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #25253a;
      background: #0d0d18;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .status {
      margin-top: 6px;
      color: #72f5ff;
      font-size: 12px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      max-width: 85%;
      line-height: 1.5;
    }

    .luna {
      background: #17172a;
      border: 1px solid #303052;
      margin-right: auto;
    }

    .user {
      background: #17353b;
      margin-left: auto;
    }

    .label {
      font-size: 11px;
      opacity: 0.6;
      margin-bottom: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #25253a;
      background: #0d0d18;
    }

    input {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #34344d;
      background: #11111d;
      color: white;
      outline: none;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      background: #72f5ff;
      color: #061014;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🌙 LUNA CORE</h1>
    <div class="status">● MOBILE CORE ONLINE</div>
  </header>

  <main id="chat">

    <div class="message luna">
      <div class="label">LUNA</div>
      Halo. Luna Core Mobile aktif.
      Apa yang ingin kita bangun hari ini?
    </div>

  </main>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Ketik pesan..."
      autocomplete="off"
    >

    <button onclick="sendMessage()">
      KIRIM
    </button>
  </div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");

function addMessage(sender, text) {

  const message = document.createElement("div");

  message.className =
    "message " + (sender === "LUNA" ? "luna" : "user");

  message.innerHTML = `
    <div class="label">${sender}</div>
    ${text}
  `;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

function lunaResponse(text) {

  const lower = text.toLowerCase();

  if (
    lower.includes("halo") ||
    lower.includes("hai")
  ) {
    return "Halo. Aku Luna Core. Aku siap menemanimu membangun sistem ini.";
  }

  if (lower.includes("siapa kamu")) {
    return "Aku adalah Luna Core, sebuah proyek AI pribadi yang sedang kita bangun bersama.";
  }

  if (lower.includes("status")) {
    return "Luna Core Mobile: ONLINE. Engine dasar aktif.";
  }

  if (lower.includes("terima kasih")) {
    return "Sama-sama. Kita lanjutkan satu tahap demi satu tahap.";
  }

  return "Pesan diterima. Engine Luna V1 masih menggunakan response lokal. Tahap berikutnya adalah menghubungkan AI.";
}

function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage("KAMU", text);

  input.value = "";

  setTimeout(() => {

    const response = lunaResponse(text);

    addMessage("LUNA", response);

  }, 400);
}

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    sendMessage();
  }

});

</script>

</body>
</html>
